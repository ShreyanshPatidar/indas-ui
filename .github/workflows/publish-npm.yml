name: Publish to npm

# The only way indas-ui reaches npm: push a tag `v<version>` on main. npm and GitHub drifted apart
# when the token here expired and every release went out by hand from a laptop instead (0.1.7 never
# reached GitHub, 0.1.8 was never committed). This publishes through npm Trusted Publishing, so
# there is no token to expire, and makes the GitHub release itself.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, e.g. v0.1.9"
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub release
      id-token: write # npm Trusted Publishing and provenance
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted Publishing needs npm 11.5.1 or later; Node 22 ships 10.
      - run: npm install -g npm@11

      - name: Tag matches the version, and is on main
        id: check
        run: |
          version=$(node -p "require('./packages/indas-ui/package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match packages/indas-ui/package.json version $version"; exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$TAG is not on main; publish only what main holds"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "indas-ui@$version" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::indas-ui@$version is already on npm; only the GitHub release is made"
          fi

      - run: npm ci
      - run: npm run type-check --workspace=indas-ui
      - run: npm run build --workspace=indas-ui
      - if: steps.check.outputs.already != 'true'
        run: npm publish --provenance --access public --workspace=indas-ui

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "indas-ui ${{ steps.check.outputs.version }}" --generate-notes --verify-tag
